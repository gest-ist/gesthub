services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - 8000:8000
    volumes:
      - ./public:/app/public
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.prod
      DJANGO_DEBUG: "false"

  collectstatic:
    build: .
    profiles: ["ops"]
    user: "${UID:-0}:${GID:-0}"
    env_file: .env
    volumes:
      - ./public/static:/app/public/static
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.prod
      DJANGO_DEBUG: "false"
    command: ["manage", "collectstatic", "--noinput", "--clear"]

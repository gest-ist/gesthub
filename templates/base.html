{% load i18n static %}

<!doctype html>
<html lang="{{ LANGUAGE_CODE }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% translate "GEST" %}{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/site.css' %}">
  </head>
  <body>
    <header>
      <nav aria-label="{% translate 'Main navigation' %}">
        <a href="{% url 'pages:home' %}">{% translate "GEST" %}</a>
        <a href="{% url 'pages:contact' %}">{% translate "Contact" %}</a>
      </nav>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
